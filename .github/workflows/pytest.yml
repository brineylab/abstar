name: tests

on:
  push:
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Immutable commit SHA to test
        required: false
        type: string

permissions:
  contents: read

env:
  MPLCONFIGDIR: ${{ github.workspace }}/.cache/matplotlib

jobs:
  fast:
    name: fast / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Verify checked-out commit
        run: test "$(git rev-parse HEAD)" = "${{ inputs.ref || github.sha }}"
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test environment
        run: python -m pip install -r requirements-test.txt
      - name: Run fast suite
        run: python -m pytest -m "not integration and not e2e and not slow" --junitxml=pytest-fast.xml -q
      - name: Upload failure report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-fast-python-${{ matrix.python-version }}
          path: pytest-fast.xml
          if-no-files-found: ignore

  integration-e2e:
    name: integration and e2e / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Verify checked-out commit
        run: test "$(git rev-parse HEAD)" = "${{ inputs.ref || github.sha }}"
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test environment
        run: python -m pip install -r requirements-test.txt
      - name: Print dependency and tool versions
        run: |
          python -VV
          python -m pip show abstar abutils polars pyarrow parasail pytest
          python - <<'PY'
          from abutils.bin import get_path
          import subprocess
          executable = get_path("mmseqs")
          subprocess.run([executable, "version"], check=True)
          PY
      - name: Run real integration and end-to-end suite
        run: python -m pytest -m "integration or e2e" -q

  dependency-bounds:
    name: dependency bounds / ${{ matrix.profile }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [lowest, newest-permitted]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Verify checked-out commit
        run: test "$(git rev-parse HEAD)" = "${{ inputs.ref || github.sha }}"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
      - name: Install declared dependency profile
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          if [ "$PROFILE" = "lowest" ]; then
            python -m pip install -r requirements-test.txt \
              "abutils==0.6.0" "polars==1.5.0" "pyarrow==16.1.0"
          else
            python -m pip install --upgrade --upgrade-strategy eager \
              -r requirements-test.txt \
              "abutils>=0.6,<0.7" "polars>=1.5,<2" "pyarrow>=16.1,<26"
          fi
      - name: Verify resolved versions remain within declared bounds
        run: |
          python -m pip show abstar abutils polars pyarrow parasail pytest
          python - <<'PY'
          from importlib.metadata import version
          from packaging.specifiers import SpecifierSet

          bounds = {
              "abutils": SpecifierSet(">=0.6,<0.7"),
              "polars": SpecifierSet(">=1.5,<2"),
              "pyarrow": SpecifierSet(">=16.1,<26"),
          }
          outside = [f"{name}=={version(name)}" for name, allowed in bounds.items()
                     if version(name) not in allowed]
          if outside:
              raise SystemExit("resolved outside declared bounds: " + ", ".join(outside))
          PY
      - name: Run fast suite and BCR/TCR sentinels
        run: |
          python -m pytest -m "not integration and not e2e and not slow" -q
          python -m pytest \
            abstar/tests/test_corpus.py::test_discovery_real_annotation_preserves_source_identity \
            'abstar/tests/test_tcr_e2e.py::test_tcr_goldens[TRA]' -q

  database-airr:
    name: ${{ matrix.component }} conformance
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: database
            tests: abstar/tests/test_database_integrity.py
          - component: AIRR
            tests: abstar/tests/test_airr.py
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Verify checked-out commit
        run: test "$(git rev-parse HEAD)" = "${{ inputs.ref || github.sha }}"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install test environment
        run: python -m pip install -r requirements-test.txt
      - name: Run focused conformance suite
        run: python -m pytest ${{ matrix.tests }} -q

  coverage:
    name: statement and branch coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Verify checked-out commit
        run: test "$(git rev-parse HEAD)" = "${{ inputs.ref || github.sha }}"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test environment
        run: python -m pip install -r requirements-test.txt
      - name: Enforce package and critical-module floors
        run: |
          python -m pytest --cov=abstar --cov-branch --cov-report=term-missing \
            --cov-report=json:/tmp/abstar-coverage.json -q
          test -s /tmp/abstar-coverage.json
          python scripts/check_coverage.py /tmp/abstar-coverage.json coverage-floors.json
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-json
          path: /tmp/abstar-coverage.json
          if-no-files-found: error

  docs:
    name: documentation warnings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Verify checked-out commit
        run: test "$(git rev-parse HEAD)" = "${{ inputs.ref || github.sha }}"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and documentation dependencies
        run: python -m pip install -e . -r docs/doc_requirements.txt
      - name: Build documentation
        run: python -m sphinx -W --keep-going -b html docs/source docs/_build/html

  build-artifacts:
    name: build and test exact distributions
    runs-on: ubuntu-latest
    needs: [fast, integration-e2e, dependency-bounds, database-airr, coverage, docs]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Verify checked-out commit
        run: test "$(git rev-parse HEAD)" = "${{ inputs.ref || github.sha }}"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Build wheel and source distribution once
        run: |
          python -m pip install "build>=1.2,<2"
          python -m build
          test "$(find dist -maxdepth 1 -type f -name '*.whl' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -type f -name '*.tar.gz' | wc -l)" -eq 1
          sha256sum dist/*.whl dist/*.tar.gz > dist/SHA256SUMS
          sha256sum --check dist/SHA256SUMS
      - name: Test each exact distribution outside the checkout
        shell: bash
        run: |
          artifact_root="$PWD/dist"
          smoke_root="$(mktemp -d)"
          awk 'BEGIN {records=0} /^>/ {records++; if (records>1) exit} {print}' \
            abstar/tests/data/real_bcr/sequences.fasta > "$smoke_root/input.fasta"
          for artifact in "$artifact_root"/*.whl "$artifact_root"/*.tar.gz; do
            kind="$(basename "$artifact" | tr '.-' '__')"
            environment="$smoke_root/venv-$kind"
            run_dir="$smoke_root/run-$kind"
            python -m venv "$environment"
            "$environment/bin/python" -m pip install "$artifact"
            mkdir "$run_dir"
            cp "$smoke_root/input.fasta" "$run_dir/input.fasta"
            cd "$run_dir"
            "$environment/bin/python" - <<'PY'
          import os
          from pathlib import Path
          import abstar, abstar.gl, abstar.pp, abstar.tl
          assert not Path(abstar.__file__).resolve().is_relative_to(
              Path(os.environ["GITHUB_WORKSPACE"]).resolve())
          PY
            "$environment/bin/abstar" --help
            "$environment/bin/abstar" run --help
            "$environment/bin/abstar" run input.fasta cli-project \
              --output_format airr --n_processes 1 --mmseqs_threads 1 --quiet
            cat > api-smoke.py <<'PY'
          import csv
          from pathlib import Path
          import abstar
          from abutils import Sequence

          def main():
              with Path("input.fasta").open() as handle:
                  identifier = handle.readline().strip()[1:]
                  sequence = "".join(line.strip() for line in handle)
              with Path("cli-project/airr/input.tsv").open(newline="") as handle:
                  cli_rows = list(csv.DictReader(handle, delimiter="\t"))
              assert len(cli_rows) == 1
              cli = cli_rows[0]
              assert cli["sequence_id"] == identifier == "ACGATACCAGGTTTCA-1_contig_2"
              assert cli["locus"] == "IGH" and cli["productive"] == "T"
              assert cli["v_call"].split("*")[0] == "IGHV3-15"
              assert cli["junction_aa"] == "CTTHPGWNYAW"

              api_rows = abstar.run([Sequence(sequence, id="artifact-api")],
                                    n_processes=1, mmseqs_threads=1)
              assert isinstance(api_rows, Sequence)
              api = api_rows
              assert api.id == "artifact-api"
              assert api.annotations["annotation_status"] == "annotated"
              assert api.annotations["locus"] == "IGH"
              assert api.annotations["productive"] is True
              assert api.annotations["v_call"].split("*")[0] == "IGHV3-15"
              assert api.annotations["junction_aa"] == "CTTHPGWNYAW"

          if __name__ == "__main__":
              main()
          PY
            "$environment/bin/python" api-smoke.py
            cd "$GITHUB_WORKSPACE"
          done
      - name: Verify manifest after smoke testing
        run: sha256sum --check dist/SHA256SUMS
      - name: Upload tested release distributions
        uses: actions/upload-artifact@v7
        with:
          name: abstar-release-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 14

  non-linux-install:
    name: macOS wheel install
    runs-on: macos-latest
    needs: build-artifacts
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Download tested distributions
        uses: actions/download-artifact@v8
        with:
          name: abstar-release-distributions
          path: dist
      - name: Verify and install the exact wheel
        shell: bash
        run: |
          shasum -a 256 --check dist/SHA256SUMS
          test "$(find dist -maxdepth 1 -type f -name '*.whl' | wc -l)" -eq 1
          wheel="$(find "$PWD/dist" -maxdepth 1 -type f -name '*.whl')"
          cd "$(mktemp -d)"
          python -m pip install "$wheel"
          python -c 'import abstar, abstar.gl, abstar.pp, abstar.tl'
          command -v abstar
          abstar --help
          abstar run --help
