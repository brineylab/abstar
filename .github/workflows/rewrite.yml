name: rewrite

on:
  push:
    branches: [rewrite]
  pull_request:
    branches: [rewrite]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m venv .venv
      - name: Build and install
        run: |
          . .venv/bin/activate
          pip install maturin
          maturin develop --release --extras test
      - name: Rust tests
        run: cargo test --workspace
      - name: Gap round trips (release, debug assertions on)
        env:
          CARGO_PROFILE_RELEASE_DEBUG_ASSERTIONS: "true"
        run: cargo test -p abstar_germline --release --test gap_roundtrip -- --include-ignored
      - name: Generator validation (release)
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        run: cargo test -p abstar_generate --release --test validation -- --include-ignored
      # x86_64 only: AVX2 and NEON may break alignment ties differently, and the floors are measured on x86_64
      - name: Accuracy gate and AIRR validation (release)
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        env:
          ABSTAR_FULL_TABLE: "1"
        run: |
          . .venv/bin/activate
          python -m pytest tests/python/test_accuracy.py -q -s
      - name: Python tests
        run: |
          . .venv/bin/activate
          python -m pytest -q --ignore tests/python/test_accuracy.py

  wheels:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, target: x86_64}
          - {os: ubuntu-latest, target: aarch64}
          - {os: macos-15, target: aarch64}
          - {os: windows-latest, target: x64}
    steps:
      - uses: actions/checkout@v5
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: auto
      - uses: actions/upload-artifact@v5
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install sdist in a fresh venv
        run: |
          python -m venv /tmp/sdist-venv
          /tmp/sdist-venv/bin/pip install dist/*.tar.gz
          /tmp/sdist-venv/bin/python -c "import abstar._core"

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m venv .venv
      - name: Build and install
        run: |
          . .venv/bin/activate
          pip install maturin
          maturin develop --release
          pip install -r docs/requirements.txt
      - name: Build docs
        run: |
          . .venv/bin/activate
          sphinx-build -W -b html docs docs/_build
