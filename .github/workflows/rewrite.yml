name: rewrite

on:
  push:
    branches: [rewrite]
  pull_request:
    branches: [rewrite]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-14]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m venv .venv
      - name: Build and install
        run: |
          . .venv/bin/activate
          pip install maturin
          maturin develop --release --extras test
      - name: Rust tests
        run: cargo test --workspace
      - name: Python tests
        run: |
          . .venv/bin/activate
          python -m pytest -q

  wheels:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, target: x86_64}
          - {os: ubuntu-latest, target: aarch64}
          - {os: macos-14, target: aarch64}
          - {os: windows-latest, target: x64}
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: auto
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install sdist in a fresh venv
        run: |
          python -m venv /tmp/sdist-venv
          /tmp/sdist-venv/bin/pip install dist/*.tar.gz
          /tmp/sdist-venv/bin/python -c "import abstar._core"
