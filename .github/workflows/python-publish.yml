name: publish tested Python distributions

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test-release:
    name: test release commit
    permissions:
      contents: read
    uses: ./.github/workflows/pytest.yml

  pypi-publish:
    name: publish exact tested distributions
    runs-on: ubuntu-latest
    needs: test-release
    permissions:
      id-token: write
      actions: read
    steps:
      - name: Download distributions produced by the release gate
        uses: actions/download-artifact@v8
        with:
          name: abstar-release-distributions
          path: dist
      - name: Verify distribution manifest
        run: |
          test "$(find dist -maxdepth 1 -type f -name '*.whl' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -type f -name '*.tar.gz' | wc -l)" -eq 1
          sha256sum --check dist/SHA256SUMS
          mkdir verified-dist
          cp dist/*.whl dist/*.tar.gz verified-dist/
      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: verified-dist/
