name: scheduled documentation linkcheck

on:
  schedule:
    - cron: "43 10 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linkcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Verify checked-out commit
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install documentation environment
        run: python -m pip install -e . -r docs/doc_requirements.txt
      - name: Check documentation links
        env:
          LINKCHECK_OUTPUT: ${{ runner.temp }}/abstar-linkcheck
        run: python -m sphinx -W --keep-going -b linkcheck docs/source "$LINKCHECK_OUTPUT"
      - name: Upload linkcheck report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: documentation-linkcheck
          path: ${{ runner.temp }}/abstar-linkcheck
          if-no-files-found: warn
