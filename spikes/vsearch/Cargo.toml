[package]
name = "vsearch"
version = "0.1.0"
edition = "2024"
publish = false

# Throwaway spike (Task 1): standalone, never joins a workspace.
[workspace]

[dependencies]
flate2 = "1.1.11"
rayon = "1.12.0"

[target.'cfg(target_arch = "x86_64")'.dependencies]
block-aligner = { version = "0.5.1", features = ["simd_avx2"] }

[target.'cfg(target_arch = "aarch64")'.dependencies]
block-aligner = { version = "0.5.1", features = ["simd_neon"] }

[profile.release]
lto = "fat"
codegen-units = 1
