# Read the Docs. The docs import abstar (the manual is rendered from the package), so the
# package is built from source here; CI's docs job builds the same way.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
    rust: "latest"

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true

python:
  install:
    - method: pip
      path: .
    - requirements: docs/requirements.txt
