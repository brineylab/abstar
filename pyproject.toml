[build-system]
requires = ["maturin>=1.7"]
build-backend = "maturin"

[project]
name = "abstar"
dynamic = ["version"]
description = "Antibody germline annotation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["typer>=0.12", "polars>=1.44"]

[project.optional-dependencies]
test = ["pytest>=8", "airr>=2.0"]

[project.scripts]
abstar = "abstar.cli:main"

[tool.maturin]
python-source = "python"
module-name = "abstar._core"
manifest-path = "crates/py/Cargo.toml"

[tool.pytest.ini_options]
testpaths = ["tests/python"]
