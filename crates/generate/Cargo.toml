[package]
name = "abstar_generate"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
abstar_germline = { path = "../germline" }
abstar_table = { path = "../table" }
arrow-array = "60.1.0"
arrow-schema = "60.1.0"
rand_chacha = "0.9"
rayon = "1"
serde_json = "1"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
thiserror = "1"
rand = "0.9"
rand_distr = "0.5"

[build-dependencies]
abstar_table = { path = "../table", default-features = false, features = ["codegen"] }

[dev-dependencies]
tempfile = "3"
criterion = "0.5"

[[bench]]
name = "generate"
harness = false
