coordinates = "read: 1-based closed"
description = "Last read base of fwr1. Null when fwr1 is null or empty."
decision = ""

[[field]]
name = "fwr1_length"
type = "int64"
nullable = true
origin = "abstar"
coordinates = ""
description = "Length of fwr1_aa in amino acids. Null when fwr1 is null."
decision = "0026"

