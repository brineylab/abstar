name = "cdr1"
type = "string"
nullable = true
origin = "airr-optional"
coordinates = ""
description = "CDR1: V bases at IMGT nt 79-114. Valued for the true alleles. An inserted base belongs to the region of the germline base it follows. Partial when truncation cuts the region, empty when the region lies inside the read but every base is deleted, null when no base of it is in the read or the read has no V base."
decision = ""

[[field]]
