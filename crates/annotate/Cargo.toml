[package]
name = "abstar_annotate"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
abstar_germline = { path = "../germline" }
abstar_table = { path = "../table" }
arrow-array = "60.1.0"
arrow-schema = "60.1.0"
flate2 = "1"
needletail = { version = "0.7.4", default-features = false }
rayon = "1"
serde_json = "1"
thiserror = "1"
parquet = { version = "60.1.0", features = ["arrow", "zstd"] }

[build-dependencies]
abstar_table = { path = "../table", default-features = false, features = ["codegen"] }

[dev-dependencies]
tempfile = "3"
criterion = "0.5"

[[bench]]
name = "pipeline"
harness = false
