airr_version = "2.0"

[[field]]
name = "sequence_id"
type = "string"
nullable = false
origin = "airr-required"
coordinates = ""
description = "Unique query sequence identifier for the Rearrangement."
decision = ""

[[field]]
name = "sequence"
type = "string"
nullable = true
origin = "airr-required"
coordinates = ""
description = "The query nucleotide sequence. Null for amino-acid input (sequence_type aa), whose input is in sequence_aa."
decision = "0039"

[[field]]
name = "rev_comp"
type = "bool"
nullable = true
origin = "airr-required"
coordinates = ""
description = "True if the alignment is on the opposite strand (reverse complemented) with respect to the query sequence."
decision = ""

[[field]]
name = "productive"
type = "bool"
nullable = true
origin = "airr-required"
coordinates = ""
description = "True if the V(D)J sequence is predicted to be productive. For amino-acid input: junction present, no stop, junction_aa starts with C and ends with W or F, and has no X."
decision = ""

