airr_version = "2.0"

[[field]]
name = "sequence_id"
type = "string"
nullable = false
origin = "airr-required"
coordinates = ""
description = "Unique query sequence identifier for the Rearrangement."
decision = ""

[[field]]
name = "sequence"
type = "string"
nullable = false
origin = "airr-required"
coordinates = ""
description = "The query nucleotide sequence."
decision = ""

[[field]]
name = "rev_comp"
type = "bool"
nullable = true
origin = "airr-required"
coordinates = ""
description = "True if the alignment is on the opposite strand (reverse complemented) with respect to the query sequence."
decision = ""

[[field]]
name = "productive"
type = "bool"
nullable = true
origin = "airr-required"
coordinates = ""
description = "True if the V(D)J sequence is predicted to be productive."
