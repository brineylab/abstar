[package]
name = "abstar_py"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
abstar_annotate = { path = "../annotate" }
abstar_germline = { path = "../germline" }
abstar_generate = { path = "../generate" }
serde_json = "1"
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py311"] }
pyo3-arrow = "0.21"

[build-dependencies]
pyo3-build-config = "0.30"
